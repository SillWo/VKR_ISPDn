name: Security checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-checks:
    name: backend-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies and tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff bandit pip-audit

      - name: Ruff
        working-directory: backend
        run: ruff check app

      - name: Bandit
        working-directory: backend
        run: bandit -r app -f txt

      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt

  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: npm audit
        working-directory: frontend
        run: npm audit

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

  snyk-monitor:
    name: snyk-monitor
    runs-on: ubuntu-latest
    needs:
      - backend-checks
      - frontend-checks
    if: ${{ github.event_name == 'push' }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check SNYK_TOKEN
        id: snyk-token
        shell: bash
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN is not set. Snyk monitor is skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ steps.snyk-token.outputs.available == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.snyk-token.outputs.available == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        if: ${{ steps.snyk-token.outputs.available == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Snyk CLI
        if: ${{ steps.snyk-token.outputs.available == 'true' }}
        run: npm install -g snyk

      - name: Install frontend dependencies for Snyk
        if: ${{ steps.snyk-token.outputs.available == 'true' }}
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Snyk monitor backend dependencies
        if: ${{ steps.snyk-token.outputs.available == 'true' }}
        working-directory: backend
        run: snyk monitor --file=requirements.txt --package-manager=pip --project-name=VKR_ISPDn-backend

      - name: Snyk monitor frontend dependencies
        if: ${{ steps.snyk-token.outputs.available == 'true' }}
        working-directory: frontend
        run: snyk monitor --project-name=VKR_ISPDn-frontend
